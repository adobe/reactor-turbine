name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check-needs-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'

      # Project Setup
      - name: Clean Sensitive Files
        if: always()
        run: |
          rm -rf ci-scripts/setup/.env
      - name: Install dependencies
        run: npm ci
      - name: Linting files
        run: npm run lint

      # Check if deployment is needed
      - name: Get local version
        id: local
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Get current 'next' tag version from npm
        id: npm
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          CURRENT_NEXT=$(npm view "$PACKAGE_NAME@next" version 2>/dev/null || echo "0.0.0")
          echo "version=$CURRENT_NEXT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          echo "Local version: ${{ steps.local.outputs.version }}"
          echo "Next version:  ${{ steps.npm.outputs.version }}"
          if [ "${{ steps.local.outputs.version }}" != "${{ steps.npm.outputs.version }}" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      run-deploy-script: ${{ steps.compare.outputs.deploy }}
      version: ${{ steps.local.outputs.version }}

  deploy:
    needs: check-needs-deploy
    if: needs.check-needs-deploy.outputs.run-deploy-script == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'

      - name: Install dependencies
        run: npm ci

      - name: Build package for npm deployment
        run: npm run build:production

      - name: Deploy package to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
          tag: "next"

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed." >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Rebuild Forge now that we've placed the new version on npm." >> $GITHUB_STEP_SUMMARY
          echo "✅ Then re-run the workflow to validate the new version." >> $GITHUB_STEP_SUMMARY

  test:
    needs: [check-needs-deploy, deploy]
    if: |
      always() && 
      needs.check-needs-deploy.result == 'success' && 
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'

      - name: Install dependencies
        run: npm ci

      # SauceLabs and Adobe SDK secrets are NOT shared with workflow runs that are
      # triggered by Dependabot or that originate from a forked repository. When
      # they are missing, the Sauce Connect tunnel can never authenticate and the
      # job hangs and retries until it times out (~10 min) instead of failing fast.
      # Detect their presence so we can run the appropriate test suite.
      - name: Detect available secrets
        id: secrets
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
        run: |
          if [ -n "$SAUCE_USERNAME" ]; then
            echo "sauce=true" >> "$GITHUB_OUTPUT"
          else
            echo "sauce=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SauceLabs secrets unavailable (likely a Dependabot or forked-PR run); running headless unit tests only."
          fi

      # Start Sauce Connect tunnel for SauceLabs
      - name: Start Sauce Connect
        if: steps.secrets.outputs.sauce == 'true'
        uses: saucelabs/sauce-connect-action@v2
        with:
          username: ${{ secrets.SAUCE_USERNAME }}
          accessKey: ${{ secrets.SAUCE_ACCESS_KEY }}
          tunnelIdentifier: github-action-tunnel

      # Unit Tests Step (cross-browser via SauceLabs)
      - name: Run unit tests
        if: steps.secrets.outputs.sauce == 'true'
        run: npm run test:unit:ci:pull:request
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

      # Fallback for runs without secrets (Dependabot / forked PRs): keep the unit
      # suite green by running it in headless Chrome, which needs no credentials.
      - name: Run unit tests (headless Chrome)
        if: steps.secrets.outputs.sauce == 'false'
        run: npm run test:unit:ci:npm:publish

      ## Coveralls
      - name: Coveralls
        if: steps.secrets.outputs.sauce == 'true'
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info

      # Integration Tests Step (requires Adobe SDK secrets)
      - name: Run integration tests
        if: steps.secrets.outputs.sauce == 'true'
        run: npm run test:integration
        env:
          RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_ID: ${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_ID }}
          RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_SECRET: ${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_SECRET }}
          RSDK_ADOBE_REACTOR_DEFAULT_COMPANY_ID: ${{ secrets.RSDK_ADOBE_REACTOR_DEFAULT_COMPANY_ID }}
          RSDK_ADOBE_DEFAULT_COMPANY_ORG_ID: ${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_ORG_ID }}
          RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_ID: ${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_ID }}
          RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_SECRET: ${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_SECRET }}
          RSDK_ADOBE_REACTOR_PREMIUM_COMPANY_ID: ${{ secrets.RSDK_ADOBE_REACTOR_PREMIUM_COMPANY_ID }}
          RSDK_ADOBE_PREMIUM_COMPANY_ORG_ID: ${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_ORG_ID }}
          RSDK_ADOBE_SCOPES: ${{ secrets.RSDK_ADOBE_SCOPES }}
          RSDK_ADOBE_REACTOR_URL: ${{ secrets.RSDK_ADOBE_REACTOR_URL }}
          RSDK_ADOBE_ENVIRONMENT: ${{ secrets.RSDK_ADOBE_ENVIRONMENT }}
