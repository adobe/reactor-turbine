name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'

      # Project Setup
      - name: Install dependencies
        run: npm ci
      - name: Linting files
        run: npm run lint

      # If the commit included changing the turbine version, we need to publish to the 'next' tag
      - name: Get local version
        id: local
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Get current 'next' tag version from npm
        id: npm
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          CURRENT_NEXT=$(npm view "$PACKAGE_NAME@next" version 2>/dev/null || echo "0.0.0")
          echo "version=$CURRENT_NEXT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          echo "Local version: ${{ steps.local.outputs.version }}"
          echo "Next version:  ${{ steps.npm.outputs.version }}"
          if [ "${{ steps.local.outputs.version }}" != "${{ steps.npm.outputs.version }}" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Build package due to commit containing package.json version change
        if: steps.compare.outputs.deploy == 'true'
        run: npm run build:production

      - name: Deploy package due to commit containing package.json version change
        if: steps.compare.outputs.deploy == 'true'
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
          tag: "next"

      # 🔥 Force exit if deploy happened
      # Exit code 78 tells GitHub Actions to stop the workflow without marking it as failed
      - name: Stop workflow after deployment due to changing package.json version
        if: steps.compare.outputs.deploy == 'true'
        run: |
          echo "✅ Deployment completed — stopping workflow." >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Rebuild Forge now that we've placed the new version on npm." >> $GITHUB_STEP_SUMMARY
          echo "✅ Then re-run this action to validate the new version." >> $GITHUB_STEP_SUMMARY
          echo "exiting with code 78." >> $GITHUB_STEP_SUMMARY
          exit 78

      - name: Skip deploy
        if: steps.compare.outputs.deploy == 'false'
        run: echo "✅ Versions match. No deploy needed."

      # Start Sauce Connect tunnel for SauceLabs
      - name: Start Sauce Connect
        uses: saucelabs/sauce-connect-action@v2
        with:
          username: ${{ secrets.SAUCE_USERNAME }}
          accessKey: ${{ secrets.SAUCE_ACCESS_KEY }}
          tunnelIdentifier: github-action-tunnel

      # Unit Tests Step
      - name: Run unit tests
        run: npm run test:unit:ci:pull:request
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

      ## Coveralls
      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info

      - name: Create .env file for integration tests
        run: |
          cat > ci-scripts/setup/.env << EOF
          # GitHub Actions environment - integration tests will use mock/test values
          RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_ID=${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_ID  }}
          RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_SECRET=${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_SECRET }}
          RSDK_ADOBE_DEFAULT_COMPANY_ORG_ID=${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_ORG_ID }}
          RSDK_ADOBE_REACTOR_DEFAULT_COMPANY_ID=${{ secrets.RSDK_ADOBE_REACTOR_DEFAULT_COMPANY_ID }}
          RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_ID=${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_ID  }}
          RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_SECRET=${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_SECRET }}
          RSDK_ADOBE_PREMIUM_COMPANY_ORG_ID=${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_ORG_ID }}
          RSDK_ADOBE_REACTOR_PREMIUM_COMPANY_ID=${{ secrets.RSDK_ADOBE_REACTOR_PREMIUM_COMPANY_ID }}
          RSDK_ADOBE_SCOPES=${{ secrets.RSDK_ADOBE_SCOPES }}
          RSDK_ADOBE_REACTOR_URL=${{ secrets.RSDK_ADOBE_REACTOR_URL }}
          RSDK_ADOBE_ENVIRONMENT=${{ secrets.RSDK_ADOBE_ENVIRONMENT }}
          EOF

      # Integration Tests Step
      - name: Run integration tests
        run: npm run test:integration

      - name: Clean Sensitive Files
        if: always()
        run: |
          rm -rf ci-scripts/setup/.env
          rm -rf ci-scripts/setup/.env.access-token*
