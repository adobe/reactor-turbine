# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish to: latest | next'
        required: false
        default: 'latest'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Tag Name
        if: ${{ github.event.inputs.tag != 'latest' && github.event.inputs.tag != 'next' }}
        run: |
          echo 'Only the tags "latest" or "next" are supported. You entered "${{ github.event.inputs.tag }}"'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'

      # Project Setup
      - name: Clean Sensitive Files
        if: always()
        run: |
          rm -rf ci-scripts/setup/.env
      - name: Install dependencies
        run: npm ci
      - name: Linting files
        run: npm run lint

      # Production Build
      - name: Build Production Bundle
        run: npm run build:production

      # Unit Tests Step
      - name: CI Tests For Publish
        run: npm run test:unit:ci:npm:publish

      # Integration Tests Step
      - name: Integration Tests For Publish
        run: npm run test:integration:ci:npm:publish
        env:
          RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_ID: ${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_ID }}
          RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_SECRET: ${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_CLIENT_SECRET }}
          RSDK_ADOBE_REACTOR_DEFAULT_COMPANY_ID: ${{ secrets.RSDK_ADOBE_REACTOR_DEFAULT_COMPANY_ID }}
          RSDK_ADOBE_DEFAULT_COMPANY_ORG_ID: ${{ secrets.RSDK_ADOBE_DEFAULT_COMPANY_ORG_ID }}
          RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_ID: ${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_ID }}
          RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_SECRET: ${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_CLIENT_SECRET }}
          RSDK_ADOBE_REACTOR_PREMIUM_COMPANY_ID: ${{ secrets.RSDK_ADOBE_REACTOR_PREMIUM_COMPANY_ID }}
          RSDK_ADOBE_PREMIUM_COMPANY_ORG_ID: ${{ secrets.RSDK_ADOBE_PREMIUM_COMPANY_ORG_ID }}
          RSDK_ADOBE_SCOPES: ${{ secrets.RSDK_ADOBE_SCOPES }}
          RSDK_ADOBE_REACTOR_URL: ${{ secrets.RSDK_ADOBE_REACTOR_URL }}
          RSDK_ADOBE_ENVIRONMENT: ${{ secrets.RSDK_ADOBE_ENVIRONMENT }}

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/jod'

      - name: Install dependencies
        run: npm ci

      - name: Build for npm deployment
        run: npm run build:production

      # Publish to NPM
      - name: Publish to NPM
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
          tag: ${{ github.event.inputs.tag }}
